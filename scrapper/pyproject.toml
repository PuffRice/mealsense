[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-group-image-scraper"
version = "1.0.0"
description = "Facebook Group Gallery Image Scraper and Vision Dataset Curation Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "facebook-scraper>=0.2.59",
    "requests>=2.31.0",
    "urllib3>=1.26.0,<2.0.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "lxml_html_clean>=0.4.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
]

[project.scripts]
fb-group-scraper = "fb_group_scraper.cli:main"
