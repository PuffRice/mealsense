<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dark-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e0b" />
      <stop offset="48%" stop-color="#0b1611" />
      <stop offset="100%" stop-color="#08110d" />
    </linearGradient>

    <radialGradient id="dark-orb-1" cx="16%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#1c4c38" stop-opacity="0.52" />
      <stop offset="52%" stop-color="#112e22" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#070e0b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="dark-orb-2" cx="85%" cy="20%" r="46%">
      <stop offset="0%" stop-color="#194232" stop-opacity="0.44" />
      <stop offset="55%" stop-color="#0f281e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#08110d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="dark-orb-3" cx="72%" cy="84%" r="54%">
      <stop offset="0%" stop-color="#22573f" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#112b20" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070e0b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="dark-orb-4" cx="24%" cy="82%" r="44%">
      <stop offset="0%" stop-color="#163829" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dark-ribbon-1" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#2a6b4e" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#163b2b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0d2319" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="dark-ribbon-2" x1="100%" y1="10%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#1f523b" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2d7253" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0a1912" stop-opacity="0.05" />
    </linearGradient>

    <filter id="dark-blur-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="72" />
    </filter>

    <filter id="dark-blur-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#dark-base)" />

  <circle cx="310" cy="190" r="680" fill="url(#dark-orb-1)" />
  <circle cx="1630" cy="220" r="620" fill="url(#dark-orb-2)" />
  <circle cx="1380" cy="900" r="740" fill="url(#dark-orb-3)" />
  <circle cx="460" cy="890" r="560" fill="url(#dark-orb-4)" />

  <g filter="url(#dark-blur-lg)">
    <path
      d="M-140,320 C280,100 700,500 1140,260 C1500,70 1760,250 2060,140 L2060,720 C1680,860 1300,540 840,740 C400,930 120,700 -140,840 Z"
      fill="url(#dark-ribbon-1)"
    />
    <path
      d="M-100,660 C340,500 660,840 1100,620 C1480,430 1760,660 2040,500 L2040,1140 L-100,1140 Z"
      fill="url(#dark-ribbon-2)"
    />
  </g>

  <g filter="url(#dark-blur-sm)" opacity="0.45">
    <path
      d="M-80,240 C380,60 760,440 1240,230 C1560,90 1820,220 2000,140"
      fill="none"
      stroke="#58a882"
      stroke-width="2"
      stroke-opacity="0.28"
    />
    <path
      d="M-60,790 C420,610 880,930 1380,700 C1660,570 1840,660 2020,600"
      fill="none"
      stroke="#499471"
      stroke-width="1.5"
      stroke-opacity="0.22"
    />
  </g>
