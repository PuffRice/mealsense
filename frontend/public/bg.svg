<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="light-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f7f4" />
      <stop offset="45%" stop-color="#e9f2ec" />
      <stop offset="100%" stop-color="#f5f8f6" />
    </linearGradient>

    <radialGradient id="light-orb-1" cx="18%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#bfe3cd" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#d7ede0" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f2f7f4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="light-orb-2" cx="84%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#c6e4d6" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#dff0e7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f2f7f4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="light-orb-3" cx="68%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#b5dcc5" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#d9ece0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f5f8f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="light-orb-4" cx="25%" cy="86%" r="44%">
      <stop offset="0%" stop-color="#d4eadb" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f2f7f4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="light-ribbon-1" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#cce7d6" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="light-ribbon-2" x1="100%" y1="10%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#b8dfc8" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#d2eadc" stop-opacity="0.25" />
    </linearGradient>

    <filter id="light-blur-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="64" />
    </filter>

    <filter id="light-blur-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#light-base)" />

  <circle cx="340" cy="180" r="680" fill="url(#light-orb-1)" />
  <circle cx="1620" cy="240" r="640" fill="url(#light-orb-2)" />
  <circle cx="1320" cy="890" r="720" fill="url(#light-orb-3)" />
  <circle cx="460" cy="920" r="560" fill="url(#light-orb-4)" />

  <g filter="url(#light-blur-lg)">
    <path
      d="M-140,340 C260,120 680,520 1120,280 C1480,84 1760,260 2060,150 L2060,740 C1680,880 1320,560 860,760 C420,950 140,720 -140,860 Z"
      fill="url(#light-ribbon-1)"
    />
    <path
      d="M-100,680 C320,520 640,860 1080,640 C1460,450 1740,680 2040,520 L2040,1140 L-100,1140 Z"
      fill="url(#light-ribbon-2)"
    />
  </g>

  <g filter="url(#light-blur-sm)" opacity="0.7">
    <path
      d="M-80,220 C380,40 760,420 1240,210 C1560,70 1820,200 2000,120"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-opacity="0.8"
    />
    <path
      d="M-60,780 C420,600 880,920 1380,690 C1660,560 1840,650 2020,590"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-opacity="0.65"
    />
  </g>
</svg>
